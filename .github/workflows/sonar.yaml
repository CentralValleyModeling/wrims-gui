name: SonarCloud Scan
on:
  workflow_run:
    workflows: ["Java CI"]
    type: [completed]
  push:
    branches:
      - main
env:
  WRIMS_GUI_DEPS: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}

jobs:
  Sonar:
    name: SonarCloud Scanner
    runs-on: windows-2022
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'push'
    env:
      REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      REF: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4.2.2
        with:
          repository: $REPO
          ref: $REF
          fetch-depth:
            0
      - name: Verify token access to wrims-engine-dependencies
        shell: bash
        run: |
          curl --fail -i -u "dwr-wrims-build:$WRIMS_GUI_DEPS" \
            https://maven.pkg.github.com/CentralValleyModeling/wrims-engine-dependencies/com.google.ortools/linearsolver/2013-01-10/linearsolver-2013-01-10.jar
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build with Gradle
        run: |
          ./gradlew clean -PcvmUserId="dwr-wrims-build" -PcvmPassword="$WRIMS_GUI_DEPS"
          ./gradlew build -x test -PcvmUserId="dwr-wrims-build" -PcvmPassword="$WRIMS_GUI_DEPS"
      - name: Analyze
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
          REQUEST_NUM: ${{ github.event.workflow_run.pull_requests[0].number }}
          REQUEST_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          ./gradlew sonar \
                  -PcvmUserId="dwr-wrims-build" \
                  -PcvmPassword="$WRIMS_GUI_DEPS" \
                  --info \
                  -Dsonar.scm.revision=$REVISION \
                  -Dsonar.pullrequest.key=$REQUEST_NUM \
                  -Dsonar.pullrequest.branch=$REQUEST_BRANCH \
                  -Dsonar.pullrequest.base=$BASE_BRANCH