name: Publish WRIMS GUI installer

on:
  release:
    types: [ published ]

jobs:
  build:
    permissions: write-all
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v2

      - name: Verify token access to wrims-engine-dependencies
        shell: bash
        run: |
          curl --fail -i -u "dwr-wrims-build:${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}" \
            https://maven.pkg.github.com/CentralValleyModeling/wrims-engine-dependencies/com.google.ortools/linearsolver/2013-01-10/linearsolver-2013-01-10.jar

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        env:
          PKG_USERNAME: ${{ github.actor }}
          PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean -PcvmUserId="dwr-wrims-build" -PcvmPassword="${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}"
          ./gradlew build -PcvmUserId="dwr-wrims-build" -PcvmPassword="${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}"
          ./gradlew :wrims-install:zipWrimsGui -PcvmUserId="dwr-wrims-build" -PcvmPassword="${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}"  

      - name: Attach WRIMS Installer zip to github deployment
        run: |
          gh release upload ${{ github.event.release.tag_name }} wrims-install/build/installer/wrims_gui_x64_${{ github.event.release.tag_name }}.zip --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach WRIMS Patch zip to github deployment
        run: |
          gh release upload ${{ github.event.release.tag_name }} wrims-install/build/patch/wrims_patch_v2.2.0_basis.zip --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach WRIMS Patch release date to github deployment
        run: |
          gh release upload ${{ github.event.release.tag_name }} wrims-install/build/patch/releasedate_v2.2.0_basis.log --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}