name: Java CI

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
  push:
    branches:
      - main
    tags:
      - '*'

jobs:

  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify token access to wrims-engine-dependencies
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}
        run: |
          curl --fail -i -u "dwr-wrims-build:$DEP_TOKEN" \
            https://maven.pkg.github.com/CentralValleyModeling/wrims-engine-dependencies/com.google.ortools/linearsolver/2013-01-10/linearsolver-2013-01-10.jar

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure old Lookup library is not resolved (WRIMS IDE)
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}
        run: |
          ./gradlew -PcvmUserId="dwr-wrims-build" -PcvmPassword="$DEP_TOKEN" \
            :wrims-ide:dependencyInsight --dependency lookup --configuration runtimeClasspath \
            | grep -qE "^mil\.army\.usace\.hec:lookup:[^:\s]+$" && exit 1 || exit 0

      - name: Ensure old Lookup library is not resolved (WRIMS INSTALL)
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}
        run: |
          ./gradlew -PcvmUserId="dwr-wrims-build" -PcvmPassword="$DEP_TOKEN" \
            :wrims-install:dependencyInsight --dependency lookup --configuration runtimeClasspath \
            | grep -qE "^mil\.army\.usace\.hec:lookup:[^:\s]+$" && exit 1 || exit 0

      - name: Ensure old Lookup library is not resolved (DWR HECDSSVue)
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}
        run: |
          ./gradlew -PcvmUserId="dwr-wrims-build" -PcvmPassword="$DEP_TOKEN" \
            :dwr-hecdssvue:dependencyInsight --dependency lookup --configuration runtimeClasspath \
            | grep -qE "^mil\.army\.usace\.hec:lookup:[^:\s]+$" && exit 1 || exit 0

      - name: Build with Gradle
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}
        run: |
          ./gradlew clean build codeCoverageReport --info -PcvmUserId="dwr-wrims-build" -PcvmPassword="$DEP_TOKEN"

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: |
            ./**/build/**/jacoco*.xml
            ./build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml

      - name: Upload Wrims-IDE jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.0.0
        with:
          name: wrims-ide
          path: |
            ./wrims-ide/build/libs/*.jar

      - name: Upload third-party jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.0.0
        with:
          name: third-party
          path: |
            ./third-party/build/libs/*.jar

      - name: Upload dwr-hecdssvue jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.0.0
        with:
          name: dwr-hecdssvue
          path: |
            ./dwr-hecdssvue/build/libs/*.jar

      - name: Upload jdiagram jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jdiagram
          path: |
            ./jdiagram/build/libs/*.jar

      - name: Upload xtext-editor jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.0.0
        with:
          name: xtext-editor
          path: |
            ./xtext-editor/build/libs/*.jar

      - name: Upload xtext-editor-ui jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.0.0
        with:
          name: xtext-editor-ui
          path: |
            ./xtext-editor-ui/build/libs/*.jar
