name: Secret Scan

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scans only the commits added by the pull request, using .gitleaks.toml in the repo root.
      - name: Scan pull request commits for secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
