plugins {
    id 'library.deps-conventions'
    id 'library.java-conventions'
    id "de.undercouch.download" version "5.7.0"
}

configurations {
    windows_x64
    graalvm
}

dependencies {
    windows_x64 "gov.ca.dwr:run-libs:0.1.0"
    implementation libs.wrims.core

    // GraalPy
    graalvm libs.bundles.graalvm.bnd
}

def date = new Date()
def formattedDate = date.format('yyyyMMdd')
def releaseDate = date.format('MM/dd/yyyy')

def wrimsGuiFolder = "wrims_gui_x64_${version}"
def wrimsGuiDownload = "${buildDir}/download/eclipse_2025_rcp.zip"
def wrimsPatchFolder = "wrims_patch_v2.2.0_basis"
def wrimsPatchReleaseDateFile = "releasedate_v2.2.0_basis.log"

def splashImagePlugin = "org.eclipse.epp.package.common_4.36.0.20250605-1300"

group = 'other'

//task to unzip the contents of the third-party jar into a temp folder
tasks.register('unzipThirdPartyLibs', Copy) {
    from(zipTree(project(':third-party').tasks.named('jar').get().archiveFile))
    into("${buildDir}/third-party")
}

//download the latest WRIMS GUI installer from DWR
tasks.register('downloadWrimsGuiInstaller', Download) {
    dependsOn unzipThirdPartyLibs
    src 'https://www.eclipse.org/downloads/download.php?file=/technology/epp/downloads/release/2025-06/R/eclipse-jee-2025-06-R-win32-x86_64.zip&r=1'
    dest new File(wrimsGuiDownload)
    onlyIfModified true
}

//clear the installer directory
tasks.register('clearInstallerFolder', Delete) {
    group 'install'
    dependsOn downloadWrimsGuiInstaller
    delete "${buildDir}/installer"
}

// Task to download and unzip the ZIP file
tasks.register('unzipWrimsGuiTemplate', Copy) {
    dependsOn clearInstallerFolder
    from(zipTree(new File(wrimsGuiDownload)))
    into("${buildDir}/installer")
}

// Task to find and rename the first subdirectory
tasks.register('renameFirstSubdirectory') {
    dependsOn unzipWrimsGuiTemplate
    doLast {
        def unzippedDir = file("${buildDir}/installer")
        def subDirs = unzippedDir.listFiles().findAll { it.isDirectory() }
        if (subDirs.size() == 1) {
            def oldDir = subDirs[0]
            def newDir = new File(unzippedDir, wrimsGuiFolder)
            if (oldDir.renameTo(newDir)) {
                println "Renamed ${oldDir.name} to ${wrimsGuiFolder}"
            } else {
                throw new GradleException("Failed to rename ${oldDir.name} to ${wrimsGuiFolder}")
            }
        } else {
            throw new GradleException("Expected exactly one subdirectory but found ${subDirs.size()}")
        }
    }
}

// Remove the dropins folder
tasks.register('removeDropinsFolder', Delete) {
    dependsOn renameFirstSubdirectory
    delete "${buildDir}/installer/${wrimsGuiFolder}/dropins"
}

// Task that clears the workspace cache
tasks.register('removeWorkspaceCache', Delete) {
    dependsOn removeDropinsFolder
    delete "${buildDir}/installer/${wrimsGuiFolder}/workspace/.metadata"
}

// Installs Xtext features into the EPP using p2 director
tasks.register('installXtext', Exec) {
    group 'install'
    description 'Installs Xtext via p2 director'
    dependsOn removeWorkspaceCache

    workingDir = file("${buildDir}/installer/${wrimsGuiFolder}")

    commandLine 'cmd', '/c',
            'eclipse.exe',
            '-nosplash',
            '-application', 'org.eclipse.equinox.p2.director',
            '-repository', 'https://download.eclipse.org/releases/2025-06',
            '-installIUs', 'org.eclipse.xtext.ui.feature.group,org.eclipse.xtext.runtime.feature.group,org.eclipse.xtext.xtext.ui.feature.group',
            '>', 'NUL'
}

// Task to copy JARs to dropins/plugins folder (Equinox dropins watcher expects a plugins directory)
tasks.register('copyJarsToDropins', Copy) {
    dependsOn installXtext
    from(project(':third-party').tasks.named('jar').get().archiveFile)
    from(project(':wrims-ide').tasks.named('jar').get().archiveFile)
    from(project(':dwr-hecdssvue').tasks.named('jar').get().archiveFile)
    from(project(':jdiagram').tasks.named('jar').get().archiveFile)
    from(project(':xtext-editor').tasks.named('jar').get().archiveFile)
    from(project(':xtext-editor-ui').tasks.named('jar').get().archiveFile)
    into("${buildDir}/installer/${wrimsGuiFolder}/dropins/plugins")
}

// Updates bundles.info with entries for all jars in dropins/plugins
// This runs after the dropins jars are copied
tasks.register('updateBundlesInfo') {
    dependsOn copyJarsToDropins
    group 'install'
    description 'Updates configuration/org.eclipse.equinox.simpleconfigurator/bundles.info with dropins jars'
    doLast {
        def installDir = file("${buildDir}/installer/${wrimsGuiFolder}")
        def dropinsDir = new File(installDir, 'dropins/plugins')
        if (!dropinsDir.exists()) {
            logger.lifecycle("No dropins/plugins directory found at: ${dropinsDir}. Skipping bundles.info update.")
            return
        }
        def configuratorDir = new File(installDir, 'configuration/org.eclipse.equinox.simpleconfigurator')
        def bundlesInfo = new File(configuratorDir, 'bundles.info')
        if (!bundlesInfo.exists()) {
            throw new GradleException("bundles.info not found at ${bundlesInfo}")
        }
        // Read existing lines and keep those that are not from dropins/plugins
        List<String> existing = bundlesInfo.readLines('UTF-8')
        List<String> kept = existing.findAll { line ->
            if (line == null || line.trim().isEmpty()) return false
            def parts = line.split(',')
            // Expect 5 columns; third is path
            return !(parts.size() >= 3 && parts[2].startsWith('dropins/plugins'))
        }
        // Build new lines for jars in dropins/plugins
        List<String> newLines = []
        File[] jarFiles = dropinsDir.listFiles(new FilenameFilter() {
            boolean accept(File dir, String name) { name.toLowerCase().endsWith('.jar') }
        }) ?: new File[0]
        // Ensure deterministic order by filename (case-insensitive)
        jarFiles.toList()
                .sort { a, b -> a.name.toLowerCase() <=> b.name.toLowerCase() }
                .each { File jarFile ->
                    java.util.jar.JarFile jar = null
                    try {
                        jar = new java.util.jar.JarFile(jarFile)
                        def mf = jar.manifest
                        def attrs = mf?.mainAttributes
                        String bsn = attrs?.getValue('Bundle-SymbolicName')
                        String ver = attrs?.getValue('Bundle-Version')

                        if (!bsn) {
                            bsn = jarFile.name.replaceFirst(/-\d+(?:\.\d+)*.*\.jar$/, '')
                        } else {
                            int semi = bsn.indexOf(';')
                            if (semi > 0) bsn = bsn.substring(0, semi)
                        }
                        if (!ver) {
                            def m = (jarFile.name =~ /-(\d[\w\.\-]*)\.jar$/)
                            ver = m.find() ? m.group(1) : '1.0.0'
                        }
                        def relPath = "dropins/plugins/${jarFile.name}"
                        newLines << "${bsn},${ver},${relPath},4,false"
                    } catch (Exception ex) {
                        throw new GradleException("Failed to read manifest from ${jarFile.name}: ${ex.message}", ex)
                    } finally {
                        if (jar != null) try {
                            jar.close()
                        } catch (IOException closeEx) {
                            logger.warn("Failed to close JarFile {}", jarFile.name, closeEx)
                        }
                    }
                }

        // Combine kept lines with new lines
        def outLines = []
        outLines.addAll(kept)
        outLines.addAll(newLines)
        bundlesInfo.setText(outLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle("Updated bundles.info with ${newLines.size()} dropins entries.")
    }
}


//Task to copy the splash.bmp file from branding into plugins/org.eclipse.epp.package.common_4.36.0.20250605-1300
//Plugin name is set as shared variable, since it is used by the about dialog for loading the splash image
tasks.register('copySplash', Copy) {
    dependsOn updateBundlesInfo
    from("src/main/resources/branding/splash.bmp", "src/main/resources/branding/unversioned_splash.bmp")
    into("${buildDir}/installer/${wrimsGuiFolder}/plugins/${splashImagePlugin}")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

//task to delete all contents of the ${buildDir}/installer/${wrimsGuiFolder}/libs folder
tasks.register('cleanLibFolder', Delete) {
    dependsOn copySplash
    delete "${buildDir}/installer/${wrimsGuiFolder}/lib"
}

//task to download native libraries (dlls)
tasks.register('getNatives', Sync) { syncTask ->
    dependsOn cleanLibFolder
    syncTask.from { configurations.windows_x64.collect { zipTree(it) } }
    syncTask.into file("${buildDir}/installer/${wrimsGuiFolder}/lib")
}

// Task to copy JARs to dropins folder
tasks.register('copyWrimsCoreToLib', Copy) {
    dependsOn getNatives
    dependsOn configurations.runtimeClasspath
    from({
        def files = configurations.runtimeClasspath.resolve()
        def core = files.find { it.name.startsWith('wrims-core-') && it.name.endsWith('.jar') }
        if (core == null) {
            throw new GradleException("wrims-core jar not found on runtimeClasspath")
        }
        core
    })
    into("${buildDir}/installer/${wrimsGuiFolder}/lib")
}

//task to copy all files from ${buildDir}/third-party/lib_x64 to ${buildDir}/installer/${wrimsGuiFolder}/lib
tasks.register('copyThirdPartyToLib', Copy) {
    dependsOn copyWrimsCoreToLib
    from("${buildDir}/third-party/lib_x64")
    from("${buildDir}/third-party/heclib")
    into("${buildDir}/installer/${wrimsGuiFolder}/lib")
}

//Copies all updated resource files into the installer
tasks.register('copyResources', Copy) {
    dependsOn copyThirdPartyToLib
    from("src/main/resources/installer")
    into("${buildDir}/installer/${wrimsGuiFolder}")
}

//Copy LICENSE file:
tasks.register('copyLicense', Copy) {
    from("${rootProject.projectDir}/LICENSE")
    into("${buildDir}/installer/${wrimsGuiFolder}")
}

// Write version information to a properties file for use in the installer
tasks.register('writeVersionProperties', DefaultTask) {
    group 'install'
    description 'Writes version information to a properties file for use in the installer.'
    dependsOn copyResources
    doLast {
        def propsFile = file("${buildDir}/installer/${wrimsGuiFolder}/version.properties")
        propsFile.text = "version=${version}\nbuild.date=${new Date().format('yyyy-MM-dd')}\n" +
                "engine.version=${libs.versions.wrims.engine.get()}\napplication.name=WRIMS 3\n" +
                "image.plugin=${splashImagePlugin}"
    }
}

//Add the release date to the installer
//generate a releasedate.log file that contains the current date in MM/DD/YYYY format
tasks.register('buildWrimsInstall', DefaultTask) {
    group 'install'
    description 'Builds the complete WRIMS3 application'
    dependsOn writeVersionProperties
    doLast {
        def releaseDateFile = file("${buildDir}/installer/${wrimsGuiFolder}/releasedate.log")
        releaseDateFile.text = new Date().format('MM/dd/yyyy')
    }
}

// Task that zips the wrims_gui_x64_${version} folder into a zip file
tasks.register('zipWrimsGui', Zip) {
    group 'release'
    description 'Creates a zip of the of the WRIMS3 gui. Depends on buildWrimsInstall.'
    dependsOn buildWrimsInstall
    from("${buildDir}/installer/${wrimsGuiFolder}")
    archiveFileName = "${wrimsGuiFolder}.zip"
    destinationDirectory = file("${buildDir}/installer")
}

//task that runs the bat file in build/download/${WRIMS_GUI_FOLDER/WRIMS3_GUI_Start.bat
//NOTE: You must build the installer before you can run it with this task using the buildWrimsInstall task
tasks.register('runWrimsGui') {
    group 'run'
    description 'Launches the built WRIMS install from the WRIMS3_GUI_Start.bat file. Requires buildWrimsInstall task to have completed.'
    doLast {
        def processBuilder = new ProcessBuilder('cmd', '/c', 'WRIMS3_GUI_Start.bat')
        processBuilder.directory(new File("${buildDir}/installer/${wrimsGuiFolder}"))
        def process = processBuilder.start()
    }
}

tasks.register('updateInstallerDropins', Copy) {
    group 'run'
    description 'Updates the dropin jars in the built installer'
    // Task to copy JARs to dropins/plugins folder (Equinox dropins watcher expects a plugins directory)
    from(project(':third-party').tasks.named('jar').get().archiveFile)
    from(project(':wrims-ide').tasks.named('jar').get().archiveFile)
    from(project(':dwr-hecdssvue').tasks.named('jar').get().archiveFile)
    from(project(':jdiagram').tasks.named('jar').get().archiveFile)
    from(project(':xtext-editor').tasks.named('jar').get().archiveFile)
    from(project(':xtext-editor-ui').tasks.named('jar').get().archiveFile)
    into("${buildDir}/installer/${wrimsGuiFolder}/dropins/plugins")
}

tasks.register('updateAndRun') {
    group 'run'
    description 'Updates the dropin jars in the built installer then runs WRIMS3 Gui from the WRIMS3_GUI_Start.bat file'
    dependsOn updateInstallerDropins
    doLast {
        def processBuilder = new ProcessBuilder('cmd', '/c', 'WRIMS3_GUI_Start.bat')
        processBuilder.directory(new File("${buildDir}/installer/${wrimsGuiFolder}"))
        def process = processBuilder.start()
    }
}

tasks.register('debugWRIMS', Exec) {
    group 'debug'
    description 'Runs WRIMS3 GUI with remote debugging enabled'
    commandLine 'cmd', '/c', 'eclipse -clean -console -consoleLog -debug .options -vmargs -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005'
    workingDir = file("${buildDir}/installer/${wrimsGuiFolder}")
}

tasks.register('updateAndDebugWRIMS', Exec) {
    group 'debug'
    description 'Updates the the dropin jars and runs WRIMS3 GUI with remote debugging enabled'
    dependsOn updateInstallerDropins
    commandLine 'cmd', '/c', 'WRIMS3_GUI_x64 -clean -console -consoleLog -debug .options -vmargs -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005'
    workingDir = file("${buildDir}/installer/${wrimsGuiFolder}")
}

//-------- PATCH INSTALLER BUILD TASKS---------------
// Task to copy JARs to patch folder
tasks.register('copyJarsToPatchDropins', Copy) {
    dependsOn unzipThirdPartyLibs
    from(project(':third-party').tasks.named('jar').get().archiveFile)
    from(project(':wrims-ide').tasks.named('jar').get().archiveFile)
    from(project(':dwr-hecdssvue').tasks.named('jar').get().archiveFile)
    from(project(':jdiagram').tasks.named('jar').get().archiveFile)
    from(project(':xtext-editor').tasks.named('jar').get().archiveFile)
    from(project(':xtext-editor-ui').tasks.named('jar').get().archiveFile)
    into("${buildDir}/patch/${wrimsPatchFolder}/dropins")
}

//task to download native libraries (dlls)
tasks.register('getNativesForPatch', Sync) { syncTask ->
    dependsOn copyJarsToPatchDropins
    syncTask.from { configurations.windows_x64.collect { zipTree(it) } }
    syncTask.into file("${buildDir}/patch/${wrimsPatchFolder}/lib")
}

// Task to copy JARs to dropins folder
tasks.register('copyWrimsCoreToPatchLib', Copy) {
    dependsOn getNativesForPatch
    dependsOn configurations.runtimeClasspath
    from({
        def files = configurations.runtimeClasspath.resolve()
        def core = files.find { it.name.startsWith('wrims-core-') && it.name.endsWith('.jar') }
        if (core == null) {
            throw new GradleException("wrims-core jar not found on runtimeClasspath")
        }
        core
    })
    into("${buildDir}/patch/${wrimsPatchFolder}/lib")
}

//task to copy all files from ${buildDir}/third-party/lib_x64 to ${buildDir}/installer/${wrimsPatchFolder}/lib
tasks.register('copyThirdPartyToPatchLib', Copy) {
    dependsOn copyWrimsCoreToPatchLib
    from("${buildDir}/third-party/lib_x64")
    from("${buildDir}/third-party/heclib")
    into("${buildDir}/patch/${wrimsPatchFolder}/lib")
}


//Copies all updated resource files into the installer
tasks.register('copyResourcesToPatch', Copy) {
    dependsOn copyThirdPartyToPatchLib
    from("src/main/resources/installer") {
        exclude "WRIMS3_GUI_Update_and_Start.bat"
    }
    into("${buildDir}/patch/${wrimsPatchFolder}")
    filter { line ->
        line.replace('${WRIMS_VERSION}', version)
    }
}

//Add the release date to the patch
//generate a releasedate.log file that contains the current date in MM/DD/YYYY format
tasks.register('addReleaseDateToPatch', DefaultTask) {
    dependsOn copyResourcesToPatch
    doLast {
        def releaseDateFile = file("${buildDir}/patch/${wrimsPatchFolder}/releasedate.log")
        releaseDateFile.text = new Date().format('MM/dd/yyyy')
    }
}

//Add the release date for patch deployment in releasedate_v2.2.0_basis.log file that contains the current date in MM/DD/YYYY format
tasks.register('addReleaseDateToPatchDeployment', DefaultTask) {
    dependsOn addReleaseDateToPatch
    doLast {
        def patchReleaseDateFile = file("${buildDir}/patch/${wrimsPatchReleaseDateFile}")
        patchReleaseDateFile.text = new Date().format('MM/dd/yyyy')
    }
}

//Zip patch files
// Task that zips the wrims_gui_x64_${version} folder into a zip file
tasks.register('zipWrimsPatch', Zip) {
    group 'release'
    description 'Builds and zips the WrimsPatch file.'
    dependsOn addReleaseDateToPatchDeployment
    from("${buildDir}/patch/${wrimsPatchFolder}")
    archiveFileName = "${wrimsPatchFolder}.zip"
    destinationDirectory = file("${buildDir}/patch")
}



